const names={
 'salary-1':['Заработная плата','Salary'], 'freelance-1':['Доход от проекта','Freelance income'], 'groceries-1':['Продукты','Groceries'],

};
function t(k){return dictionaries[state.lang][k]||k}
function name(r){return names[r.provider_transaction_id]?.[state.lang==='ru'?0:1]||r.description}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n,signed=false){if(n===null)return '—';const v=Number(n)/100;return (signed&&v>0?'+':'')+new Intl.NumberFormat(state.lang==='ru'?'ru-RU':'en-US',{maximumFractionDigits:v%1?2:0}).format(v)+(state.lang==='ru'?' ₽':' RUB')}
function date(s){return new Date(s).toLocaleDateString(state.lang==='ru'?'ru-RU':'en-US',{day:'2-digit',month:'short',timeZone:'UTC'})}
const paths={lock:'M5 10h14v11H5zM8 10V6a4 4 0 0 1 8 0v4M12 14v3',key:'M8 14a5 5 0 1 1 4-8l9 0v4h-3v3h-4l-2-1',grid:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',list:'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',check:'M9 12l2 2 4-4M12 3l8 3v6c0 5-8 9-8 9s-8-4-8-9V6z',source:'M8 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3M12 3h9v9M10 14L21 3',down:'M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5',calendar:'M5 4h14a2 2 0 0 1 2 2v14H3V6a2 2 0 0 1 2-2zM7 2v5M17 2v5M3 10h18',wallet:'M3 7V5a2 2 0 0 1 2-2h13v4M3 7h18v14H5a2 2 0 0 1-2-2V7zm13 5h5v5h-5z',arrow:'M5 12h14m-5-5 5 5-5 5',up:'M7 17L17 7M7 7h10v10',card:'M3 5h18v14H3zM3 10h18M7 15h3',search:'M21 21l-5-5M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16',close:'M6 6l12 12M18 6 6 18',bank:'M3 9l9-6 9 6H3zm2 3v7m7-7v7m7-7v7M3 21h18',info:'M12 11v6M12 7h.01M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20'};
function icon(k){return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[k]||paths.info}"/></svg>`}
function button(action,text,cls='btn',extra=''){return `<button class="${cls}" data-action="${action}" ${extra}>${text}</button>`}
function snapshot(){return M.calculate(data,state.account,state.period)}
function panelHead(title,subtitle='',right=''){return `<div class="panel-head"><div><h2>${title}</h2>${subtitle?`<div class="panel-sub">${subtitle}</div>`:''}</div>${right}</div>`}
function metric(key,label,sub,ic,s){return `<button class="kpi" data-action="metric" data-key="${key}" aria-label="${esc(t(label)+': '+money(s.metrics[key]))}"><div class="kpi-head"><span>${t(label)}</span>${icon(ic)}</div><div class="kpi-number" data-metric="${key}">${money(s.metrics[key])}</div><div class="kpi-sub">${s.metrics[key]===null?t('partial'):t(sub)}</div></button>`}
function kpis(s){return `<div class="kpis">${metric('income_minor','income','incomeSub','up',s)}${metric('net_spending_minor','net','netSub','list',s)}${metric('closing_cash_minor','cash','cashSub','wallet',s)}${metric('closing_liability_minor','debt','debtSub','card',s)}</div>`}
function flowChart(s){
 const points=s.daily.map(r=>({day:r.day,v:Number(r.value_minor)/100000}));const W=window.innerWidth<=730?Math.max(285,window.innerWidth-70):620,H=185,L=40,R=17,T=14,B=31;
 const max=Math.max(0,...points.map(p=>p.v)),min=Math.min(0,...points.map(p=>p.v));
 const hi=max===min?1:Math.ceil(max/25)*25,lo=min===0?0:Math.floor(min/25)*25;
 const x=i=>L+i*(W-L-R)/Math.max(1,points.length-1),y=v=>T+(hi-v)*(H-T-B)/(hi-lo);
 let line='';points.forEach((p,i)=>line+=(i?`H${x(i).toFixed(1)}V${y(p.v).toFixed(1)}`:`M${x(i)},${y(p.v).toFixed(1)}`));
 const area=line+`L${x(points.length-1)},${y(0)}L${L},${y(0)}Z`;
 const ticks=Array.from({length:4},(_,i)=>lo+(hi-lo)*i/3);
 const marks=window.innerWidth<=730?[0,Math.floor((points.length-1)/2),points.length-1]:[...new Set([0,Math.floor((points.length-1)/4),Math.floor((points.length-1)/2),Math.floor((points.length-1)*3/4),points.length-1])];
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('flow')} — ${money(s.metrics.cash_movement_minor)}"><defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#51b99b" stop-opacity=".17"/><stop offset="1" stop-color="#51b99b" stop-opacity=".01"/></linearGradient></defs>${ticks.map(v=>`<line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}" stroke="#e9eef2" stroke-dasharray="3 4"/><text x="${L-10}" y="${y(v)+4}" text-anchor="end" fill="#8592a6" font-size="10">${Math.round(v)}</text>`).join('')}<path d="${area}" fill="url(#area)"/><path d="${line}" fill="none" stroke="#0a8970" stroke-width="2.7" stroke-linejoin="round"/>${points.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="4" fill="#0a8970" opacity="${i===points.length-1?'1':'0'}"><title>${date(p.day+'T00:00:00Z')}: ${money(BigInt(s.daily[i].value_minor))}</title></circle>`).join('')}${marks.map(i=>`<text x="${x(i)}" y="${H-8}" fill="#8592a6" font-size="10" text-anchor="middle">${date(points[i].day+'T00:00:00Z')}</text>`).join('')}</svg>`;
}
function spending(s){const total=s.metrics.net_spending_minor;return `<section class="panel">${panelHead(t('spending'),t('spendingSub'))}<div class="split-value">${money(total)}</div><div class="composition">${s.categories.length?s.categories.map(c=>`<button class="composition-row" data-action="tx" data-id="${c.id}"><div class="composition-label"><span>${name(c.rows[0])}</span><strong>${money(c.minor)}</strong></div><div class="bartrack"><div class="bar" style="width:${total>0n?Number(c.minor*10000n/total)/100:0}%"></div></div></button>`).join(''):`<p class="micro">${t('noRows')}</p>`}</div><div class="composition-footer">${s.refunds.length?t('categoriesNote'):t('incomeSub')}</div></section>`}
function checks(s){return `<section class="panel">${panelHead(t('checks'),t('checksSub'))}<div class="checks">${[['duplicate_observations','duplicates','duplicateDesc',false],['reconciled_movement_groups','movements','movementDesc',false],['pending_transactions','pending','pendingDesc',true]].map(([n,label,desc,amber])=>`<div class="check-row"><div class="checknum ${amber?'amber':''}">${s.counts[n]}</div><div class="checktext"><strong>${t(label)}</strong><p>${t(desc)}</p></div></div>`).join('')}</div><div class="panel-link">${button('nav',`${t('inspect')} ${icon('arrow')}`,'btn subtle','data-view="reconciliation"')}</div></section>`}
function accounts(s){return `<section class="panel">${panelHead(t('accounts'),t('accountsSub'))}<div class="panel-body" style="padding-top:2px;padding-bottom:9px">${s.selected.map(a=>`<button class="account-row" data-action="account" data-account="${a.account_id}"><div class="account-icon">${icon(a.type==='credit'?'card':'bank')}</div><div class="account-main"><strong>${t(a.account_id)}</strong><small>${t(a.type==='credit'?'liability':'balance')} · RUB</small></div><div class="account-value">${s.full?money(a.type==='credit'?-BigInt(a.closing_signed_balance_minor):BigInt(a.closing_signed_balance_minor)):'—'}<small>${s.full?'01.09.2026':t('partial')}</small></div></button>`).join('')}</div><div class="panel-link">${state.account!=='all'?button('account',t('reset'),'btn subtle','data-account="all"'):''}</div></section>`}
function overview(s){return `${kpis(s)}<div class="grid-main"><section class="panel">${panelHead(t('flow'),t('flowSub'),`<span class="tag gray">RUB</span>`)}<div class="chart-big-number">${money(s.metrics.cash_movement_minor,true)} <small>${t('forPeriod')}</small></div><div class="chart">${flowChart(s)}</div><div class="chart-caption"><span class="legend"><i></i>${t('ledger')}</span><span>${t('axis')}</span></div></section>${spending(s)}</div><div class="grid-secondary"><div>${accounts(s)}<section class="panel" style="margin-top:22px">${panelHead(t('cashVsResult'))}<div class="bridge"><div><p>${t('cashChange')}</p>${button('metric',money(s.metrics.cash_movement_minor,true),'btn subtle','data-key="cash_movement_minor"')}</div><div class="bridge-arrow">≠</div><div><p>${t('surplus')}</p>${button('metric',money(s.metrics.economic_surplus_minor,true),'btn subtle','data-key="economic_surplus_minor"')}</div></div></section></div>${checks(s)}</div>`}
function transactionTable(s){const rows=M.filterTable(s,state.kind,state.search);return `<div class="tablewrap"><table><thead><tr><th>${t('date')}</th><th>${t('operation')}</th><th>${t('account')}</th><th>${t('status')}</th><th>${t('amount')}</th></tr></thead><tbody>${rows.map(r=>`<tr class="rowclick" data-action="tx" data-id="${r.provider_transaction_id}" tabindex="0" role="button" aria-label="${esc(name(r)+', '+money(r.minor))}"><td>${date(r.booked_at)}</td><td><div class="tx-title">${esc(name(r))}</div><div class="tx-id">${r.provider_transaction_id}</div></td><td>${t(r.account_id)}</td><td><span class="tag ${r.status==='pending'?'amber':'gray'}">${t(r.status==='pending'?'pendingStatus':'posted')}</span></td><td class="amount ${r.minor>0n?'positive':''}">${money(r.minor,true)}</td></tr>`).join('')}</tbody></table>${rows.length?'':`<div class="empty">${t('noRows')}</div>`}</div><div class="table-foot"><strong>${t('shown')} ${rows.length} ${t('of')} ${s.rows.length}.</strong> ${t('tableNote')}</div>`}
function transactions(s){return `<section class="panel">${panelHead(t('transactions'),`${s.rows.length} ${t('viewRows')}`,`<span class="badge-count">${t('readOnly')}</span>`)}<div class="table-filters"><label class="search">${icon('search')}<input id="search-input" type="search" maxlength="200" placeholder="${t('search')}" value="${esc(state.search)}" aria-label="${t('search')}"></label><label class="control"><span class="screen-reader">${t('allTypes')}</span><select id="kind-filter">${['all','income','expense','refund','own_transfer','card_repayment','pending'].map(k=>`<option value="${k}" ${state.kind===k?'selected':''}>${t(k==='all'?'allTypes':k)}</option>`).join('')}</select></label></div><div id="table-content">${transactionTable(s)}</div></section>`}
function recon(s){const scoped=r=>(state.account==='all'||r.account_id===state.account)&&r.booked_at>=s.range.from&&r.booked_at<s.range.to;const sumNeg=rows=>rows.filter(r=>r.status==='posted'&&r.minor<0n).reduce((z,r)=>z-r.minor,0n);const rawTotal=sumNeg(data.raw.filter(scoped)),dup=sumNeg(data.duplicates.filter(scoped)),move=sumNeg(s.posted.filter(r=>['own_transfer','card_repayment'].includes(r.kind)));return `<div class="recon-summary"><section class="panel">${panelHead(t('naive'),t('naiveSub'))}<div class="chart-big-number" style="color:#a47333">${money(rawTotal)}</div><div class="calculation">${[['rawNeg',rawTotal],['removeDup',-dup],['removeMove',-move],['deductRefund',-s.metrics.attributable_refunds_minor]].map(([label,value])=>`<div class="calc-row"><span>${t(label)}</span><strong>${money(value)}</strong></div>`).join('')}<div class="calc-row result"><span>${t('corrected')}</span><strong>${money(s.metrics.net_spending_minor)}</strong></div><p class="micro">${t('notSavings')}</p></div></section><section class="panel">${panelHead(t('whyMatters'))}<div class="panel-body"><p class="explain">${t('whyText')}</p>${button('metric',t('formula')+' '+icon('arrow'),'btn primary','data-key="net_spending_minor"')}<p class="explain" style="margin-top:25px">${t('scopeNote')}</p><div class="provenance">${s.counts.observations} ${t('rawCount')} → ${s.counts.unique_transactions} ${t('uniqueCount')}<br>${t('cutoff')}</div></div></section></div><div class="rules">${[['ruleDuplicate','duplicateRule','duplicate','duplicate_observations'],['ruleTransfer','transferRule','movement','reconciled_movement_groups'],['ruleRefund','refundRule','refund',''],['rulePending','pendingRule','pending','pending_transactions']].map(([label,description,mode,n])=>`<section class="panel rule-card"><span class="tag ${mode==='pending'?'amber':''}">${n?s.counts[n]:s.refunds.length}</span><h3>${t(label)}</h3><p>${t(description)}</p>${button('rule',t('seeRecords')+' '+icon('arrow'),'btn subtle',`data-mode="${mode}"`)}</section>`).join('')}</div>`}
function sources(s){return `<div class="source-grid"><section class="panel">${panelHead(t('origin'),t('originSub'))}<div class="source-list"><div class="source-item"><span class="tag amber">${t('synthetic')}</span></div><div class="source-item"><strong>transactions.csv</strong><div class="micro">12 ${t('rawCount')} · 11 ${t('uniqueCount')} · RUB</div><code>SHA-256: ${D.provenance.csv_sha256}</code>${button('source-csv',t('openSource'),'btn')}</div><div class="source-item"><strong>manifest.json</strong><div class="micro">${t('cutoff')}</div><code>SHA-256: ${D.provenance.manifest_sha256}</code></div><div class="source-item"><strong>${t('sourceCommit')}</strong><code>${D.provenance.repo}</code><code>${D.provenance.commit}</code><code>tests/fixtures/synthetic/</code></div><div class="source-item"><strong>${t('currentScope')}</strong><div class="micro">${t(state.account==='all'?'all':state.account)} · ${t(state.period)}<br>${t('noComparison')}</div></div></div></section><div><section class="panel">${panelHead(t('limits'))}<div class="panel-body"><p class="explain">${t('limitsText')}</p><span class="tag gray">${t('fixtureOnly')}</span><p class="micro">${t('fullFixture')}</p></div></section><section class="panel" style="margin-top:22px">${panelHead(t('integration'))}<div class="panel-body"><p class="explain">${t('integrationText')}</p><div class="provenance">FIN-001 → versioned JSON snapshot → read-only UI<br>Source engine QA ≠ prototype UI checks</div></div></section></div></div>`}
function render(){const s=snapshot();document.documentElement.lang=state.lang;document.title='FinControl — '+t(state.view);document.getElementById('app').innerHTML=`<div class="layout"><aside class="sidebar"><div class="brand"><div class="brandmark" aria-hidden="true"><i></i><i></i><i></i></div><div class="brand-copy"><div class="brandname">FinControl</div><div class="brandcaption">FINANCE · EXPLAINED</div></div></div><nav class="navgroup" aria-label="${t('workspace')}"><div class="navcaption">${t('workspace')}</div>${[['overview','grid'],['transactions','list'],['reconciliation','check'],['sources','source'],['security','lock']].map(([v,ic])=>button('nav',icon(ic)+`<span>${t(v)}</span>`,'navbtn '+(state.view===v?'active':''),`data-view="${v}" aria-current="${state.view===v?'page':'false'}" aria-label="${t(v)}"`)).join('')}</nav><div class="sidebar-bottom"><strong>${t('local')}</strong>${t('safe')}</div><div class="sideversion">FINCONTROL / 0.2</div></aside><main class="main"><header class="topbar"><div><div class="breadcrumb">${t('analytics')}<span>/</span>${t(state.view)}</div><h1>${t(state.view==='overview'?'title':state.view)}</h1></div><div class="top-actions"><div class="lang" aria-label="Language">${['ru','en'].map(l=>button('lang',l.toUpperCase(),state.lang===l?'active':'',`data-lang="${l}" aria-pressed="${state.lang===l}"`)).join('')}</div>${button('vault-save',icon('lock')+vt('save'),'btn primary')}${button('export',icon('down')+t('export'),'btn')}</div></header><div class="toolbar"><div class="demo-label"><i class="dot"></i>${t('demo')}</div><div class="controls"><label class="control">${icon('wallet')}<span class="screen-reader">${t('account')}</span><select id="account-filter">${['all','checking','savings','card'].map(a=>`<option value="${a}" ${state.account===a?'selected':''}>${t(a)}</option>`).join('')}</select></label><label class="control">${icon('calendar')}<span class="screen-reader">${t('forPeriod')}</span><select id="period-filter">${['full','first','last'].map(p=>`<option value="${p}" ${state.period===p?'selected':''}>${t(p)}</option>`).join('')}</select></label></div></div>${s.full?'':`<div class="notice" role="status">${t('notice')}</div>`}<div id="view">${state.view==='overview'?overview(s):state.view==='transactions'?transactions(s):state.view==='reconciliation'?recon(s):state.view==='security'?vaultPage():sources(s)}</div><footer class="bottomline" style="margin-top:24px"><span>${t('sourceNote')}</span><span>${t('version')} <span class="footer-id">/ ${D.provenance.commit.slice(0,7)}</span></span></footer></main></div>`;bindControls()}
function bindControls(){document.getElementById('account-filter').addEventListener('change',e=>{state.account=e.target.value;render()});document.getElementById('period-filter').addEventListener('change',e=>{state.period=e.target.value;render()});document.getElementById('kind-filter')?.addEventListener('change',e=>{state.kind=e.target.value;updateTable()});document.getElementById('search-input')?.addEventListener('input',e=>{state.search=e.target.value;updateTable()})}
function updateTable(){document.getElementById('table-content').innerHTML=transactionTable(snapshot())}
function detailRows(rows){return rows.length?rows.map(r=>`<div class="detail-row"><div>${esc(name(r))}<small>${r.provider_transaction_id} · CSV ${r.source_row} · ${t(r.account_id)}</small>${state.account!=='all'&&r.account_id!==state.account?`<div class="micro">${t('context')}</div>`:''}</div><strong>${money(r.minor,true)}</strong></div>`).join(''):`<p class="micro">${t('noEvidence')}</p>`}
function openDialog(title,body){const dialog=document.getElementById('detail');dialog.innerHTML=`<div class="dialog-head"><div><div class="micro" style="margin-bottom:6px">FinControl · ${t('detail')}</div><h2 id="dialog-title">${title}</h2></div>${button('close',icon('close'),'close',`aria-label="${t('close')}"`)}</div><div class="dialog-body">${body}</div>`;dialog.showModal()}
function metricDialog(key){const s=snapshot(),map={income_minor:['income','incomeFormula',s.income],net_spending_minor:['net','netFormula',[...s.expenses,...s.refunds]],closing_cash_minor:['cash','cashFormula',null],closing_liability_minor:['debt','debtFormula',null],economic_surplus_minor:['surplus','surplusFormula',[...s.income,...s.expenses,...s.refunds]],cash_movement_minor:['cashChange','cashMovementFormula',s.cashRows]};const [label,formula,rows]=map[key];let evidence=rows!==null?detailRows(rows):s.full?s.selected.filter(a=>key==='closing_cash_minor'?a.type==='depository':a.type==='credit').map(a=>`<div class="detail-row"><div>${t(a.account_id)}<small>manifest.json · ${a.account_id} · 01.09.2026</small></div><strong>${money(a.type==='credit'?-BigInt(a.closing_signed_balance_minor):BigInt(a.closing_signed_balance_minor))}</strong></div>`).join(''):`<p class="micro">${t('noBalance')}</p>`;openDialog(t(label),`<div class="dialog-metric">${money(s.metrics[key])}</div><div class="formula">${t(formula)}</div><h3>${t('evidence')}</h3>${evidence||`<p class="micro">${t('noEvidence')}</p>`}<h3>${t('metadata')}</h3><div class="provenance">${t('metricScope')}<br>${t(state.account)} · ${t(state.period)}<br>${t('synthetic')} · ${D.provenance.commit.slice(0,7)}</div>`)}
function transactionDialog(id){const r=data.rows.find(r=>r.provider_transaction_id===id);if(!r)return;const explanation=r.status==='pending'?'excludedPending':['own_transfer','card_repayment'].includes(r.kind)?'excludedMovement':r.kind==='refund'?'refundExplanation':r.kind==='expense'?'expenseExplanation':'incomeExplanation';const related=r.kind==='refund'?data.rows.filter(x=>x.provider_transaction_id===r.link_ref):['own_transfer','card_repayment'].includes(r.kind)?[...(data.groups.get(JSON.stringify([r.kind,r.link_ref]))||[])].filter(x=>x!==r):r.kind==='expense'?data.rows.filter(x=>x.link_ref===r.provider_transaction_id&&x.kind==='refund'):[];openDialog(esc(name(r)),`<div class="dialog-metric">${money(r.minor,true)}</div><div class="formula">${t(explanation)}</div><div class="provenance">${t('original')}: ${r.source_row}<br>ID: ${r.provider_transaction_id}<br>${t('account')}: ${t(r.account_id)}<br>${r.booked_at} · RUB · ${t(r.status==='pending'?'pendingStatus':'posted')}</div>${related.length?`<h3>${t('reconciliation')}</h3>${detailRows(related)}`:''}<p class="micro">${t('synthetic')} · ${t('readOnly')}</p>`)}
function ruleDialog(mode){const s=snapshot();let rows=[],label,description;if(mode==='duplicate'){rows=data.duplicates.filter(r=>(state.account==='all'||r.account_id===state.account)&&r.booked_at>=s.range.from&&r.booked_at<s.range.to);label='ruleDuplicate';description='duplicateRule'}else if(mode==='movement'){rows=s.visibleGroups.flat();label='ruleTransfer';description='transferRule'}else if(mode==='refund'){rows=s.refunds;label='ruleRefund';description='refundRule'}else{rows=s.rows.filter(r=>r.status==='pending');label='rulePending';description='pendingRule'}openDialog(t(label),`<div class="formula">${t(description)}</div>${detailRows(rows)}<p class="micro">${t('scopeNote')}</p>`)}
function saveFile(name,text,bom=true){const url=URL.createObjectURL(new Blob([bom?'\ufeff':'',text],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);const box=document.getElementById('toast');box.textContent=t('exported');box.hidden=false;setTimeout(()=>box.hidden=true,2500)}
function dispatch(el){if(handleVaultAction(el))return;const a=el.dataset.action;if(a==='nav'){state.view=el.dataset.view;state.kind='all';state.search='';render();window.scrollTo({top:0,behavior:'instant'})}else if(a==='lang'){state.lang=el.dataset.lang;render()}else if(a==='account'){state.account=el.dataset.account;render()}else if(a==='metric')metricDialog(el.dataset.key);else if(a==='tx')transactionDialog(el.dataset.id);else if(a==='close')document.getElementById('detail').close();else if(a==='rule')ruleDialog(el.dataset.mode);else if(a==='source-csv')confirmPlainExport('synthetic-source-full.csv',D.csv,false,true);else if(a==='export'){const s=snapshot(),rows=state.view==='transactions'?M.filterTable(s,state.kind,state.search):s.rows;confirmPlainExport(`fincontrol-${state.account}-${state.period}.csv`,M.csvExport(rows))}}
document.addEventListener('click',e=>{const action=e.target.closest('[data-action]');if(action)dispatch(action)});
document.addEventListener('keydown',e=>{if(['Enter',' '].includes(e.key)&&e.target.matches('tr[data-action]')){e.preventDefault();dispatch(e.target)}});
document.getElementById('detail').addEventListener('click',e=>{if(e.target===e.currentTarget){const b=e.currentTarget.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)e.currentTarget.close()}});
let smallLayout=window.innerWidth<=730;window.addEventListener('resize',()=>{const next=window.innerWidth<=730;if(next!==smallLayout){smallLayout=next;render()}});
window.FinControl={state,snapshot,get data(){return data;},render};render();
</script></body></html>
